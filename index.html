<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/ikon.png" />

    <title>Sena Şaylıg — Endüstri &amp; Bilgisayar Mühendisi</title>
    <meta
      name="description"
      content="Sena Şaylıg'ın portfolyosu. Endüstri ve bilgisayar mühendisliğinin kesişiminde tasarım, simülasyon, optimizasyon ve yazılım projeleri."
    />
    <meta name="author" content="Sena Şaylıg" />
    <meta name="theme-color" content="#08090c" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sena Şaylıg — Endüstri &amp; Bilgisayar Mühendisliği" />
    <meta
      property="og:description"
      content="Tasarım, simülasyon, optimizasyon ve yazılım projeleri."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Tema ve dil tercihini React mount olmadan uygula (flash önleme).
      (function () {
        try {
          var theme = localStorage.getItem('ss-theme') || 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
          root.lang = localStorage.getItem('ss-lang') || 'tr'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
